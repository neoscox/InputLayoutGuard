name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # same commit as builtin-baseline in vcpkg.json
          vcpkgGitCommitId: 099fb9250d916511782bf5215f01f2e7141beb3a

      - name: Build
        run: cmake --workflow --preset release-msvc

      - name: Package
        shell: pwsh
        run: ./package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputLayoutGuard
          path: |
            InputLayoutGuard-*.zip
            build/Release/InputLayoutGuard.pdb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InputLayoutGuard-*.zip
          generate_release_notes: true
