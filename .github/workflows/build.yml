name: build

# Build check only: binaries are published on Nexus Mods, not as GitHub releases.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # the vcpkg tool revision the release builds use; package versions still come from builtin-baseline in vcpkg.json
          vcpkgGitCommitId: 9e44ec0e9f247d77c230ced0ee66c76296837807

      - name: Build
        run: cmake --workflow --preset release-msvc

      - name: Package
        shell: pwsh
        run: ./package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputLayoutGuard
          path: |
            InputLayoutGuard-*.zip
            build/Release/InputLayoutGuard.pdb
